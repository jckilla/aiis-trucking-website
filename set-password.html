<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password — Aduna Dialer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #05070a; --accent: #00FFCC; --accent-dim: rgba(0,255,204,0.08); --text: #f0f0f0; --text-secondary: #888; --text-muted: #555; --danger: #ff4757; --success: #00e5a0; }
    body { font-family: 'Inter', sans-serif; background: #05070a; color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .lg-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #05070a; }
    .lg-blob { position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.55; will-change: transform; }
    .lg-blob.b1 { width: 48vw; height: 48vw; left: -10vw; top: -12vw; background: radial-gradient(circle, rgba(0,255,204,0.55), transparent 62%); animation: f1 28s ease-in-out infinite; }
    .lg-blob.b2 { width: 42vw; height: 42vw; right: -8vw; top: 4vh; background: radial-gradient(circle, rgba(0,170,255,0.45), transparent 62%); animation: f2 34s ease-in-out infinite; }
    .lg-blob.b3 { width: 40vw; height: 40vw; left: 26vw; bottom: -16vw; background: radial-gradient(circle, rgba(139,92,246,0.40), transparent 62%); animation: f3 40s ease-in-out infinite; }
    @keyframes f1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(9vw,7vh) scale(1.14)} }
    @keyframes f2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-8vw,9vh) scale(1.10)} }
    @keyframes f3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(6vw,-7vh) scale(1.16)} }
    .wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; }
    .card { width: 100%; max-width: 440px; position: relative; padding: 40px 36px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      -webkit-backdrop-filter: blur(22px) saturate(160%) brightness(1.06); backdrop-filter: blur(22px) saturate(160%) brightness(1.06);
      border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18); }
    .head { text-align: center; margin-bottom: 36px; }
    .head h1 { font-family: 'Syncopate', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
    .accent-line { width: 48px; height: 2px; background: var(--accent); margin: 0 auto 16px; }
    .head p { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
    .form { display: flex; flex-direction: column; gap: 18px; }
    label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: border-color 0.3s, box-shadow 0.3s; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    input::placeholder { color: var(--text-muted); font-size: 13px; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .btn { width: 100%; padding: 16px; background: var(--accent); color: #050505; border: none; border-radius: 10px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-top: 6px; }
    .btn:hover { background: #00e0b4; box-shadow: 0 4px 24px rgba(0,255,204,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
    .msg.err { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.25); color: var(--danger); }
    .msg.ok { background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.25); color: var(--success); }
    .msg.visible { display: block; }
    .hint { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--text-muted); text-align: center; margin-top: 14px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #050505; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="lg-bg" aria-hidden="true"><div class="lg-blob b1"></div><div class="lg-blob b2"></div><div class="lg-blob b3"></div></div>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <h1>Set Password</h1>
        <div class="accent-line"></div>
        <p>Aduna Dialer — Account Setup</p>
      </div>
      <div id="loading" class="hint">Verifying your invite link…</div>
      <form class="form" id="pwForm" style="display:none;">
        <div>
          <label for="email">Account</label>
          <input type="email" id="email" disabled />
        </div>
        <div>
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8" />
        </div>
        <div>
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter your password" required autocomplete="new-password" minlength="8" />
        </div>
        <div id="msg" class="msg"></div>
        <button type="submit" class="btn" id="btn">Set Password &amp; Sign In</button>
      </form>
      <div id="invalid" class="msg err" style="display:none;">This setup link is invalid or has expired. Ask an administrator to send a new invite, or <a href="login.html" style="color:var(--accent);">go to sign in</a>.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var SUPABASE_URL = 'https://cqijyhudfiteivejcgox.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxaWp5aHVkZml0ZWl2ZWpjZ294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NzI5OTUsImV4cCI6MjA4OTI0ODk5NX0.08wZTXZSQvB98VEKCMLVc0EcuxleNVSOF5Fg0eKENHI';
      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var loading = document.getElementById('loading');
      var form = document.getElementById('pwForm');
      var invalid = document.getElementById('invalid');
      var emailEl = document.getElementById('email');
      var msg = document.getElementById('msg');
      var btn = document.getElementById('btn');

      function showForm(session) {
        loading.style.display = 'none';
        form.style.display = 'flex';
        if (session && session.user) emailEl.value = session.user.email || '';
      }
      function showInvalid() { loading.style.display = 'none'; invalid.style.display = 'block'; }

      // The invite/recovery link puts a token in the URL hash; the Supabase client
      // auto-exchanges it for a session on load. Give it a moment, then check.
      var settled = false;
      sb.auth.onAuthStateChange(function (event, session) {
        if (settled) return;
        if (session && session.user) { settled = true; showForm(session); }
      });
      setTimeout(function () {
        if (settled) return;
        sb.auth.getSession().then(function (r) {
          if (settled) return; settled = true;
          if (r && r.data && r.data.session && r.data.session.user) showForm(r.data.session);
          else showInvalid();
        });
      }, 1200);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        msg.classList.remove('visible', 'ok', 'err');
        var pw = document.getElementById('password').value;
        var cf = document.getElementById('confirm').value;
        if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; msg.classList.add('msg', 'err', 'visible'); return; }
        if (pw !== cf) { msg.textContent = 'Passwords do not match.'; msg.classList.add('msg', 'err', 'visible'); return; }
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>SAVING…';
        try {
          var res = await sb.auth.updateUser({ password: pw });
          if (res.error) throw res.error;
          msg.textContent = 'Password set! Redirecting to the dialer…';
          msg.classList.add('msg', 'ok', 'visible');
          setTimeout(function () { window.location.href = 'portal.html'; }, 1200);
        } catch (err) {
          msg.textContent = err.message || 'Could not set password. The link may have expired.';
          msg.classList.add('msg', 'err', 'visible');
          btn.disabled = false; btn.innerHTML = 'Set Password &amp; Sign In';
        }
      });
    });
  </script>
</body>
</html>
