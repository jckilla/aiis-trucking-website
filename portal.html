      leadsSearchTimer = setTimeout(function() {
        leadsFilter.search = val;
        leadsPage = 0;
        renderLeads(document.getElementById('pageContent'));
      }, 400);
    });
  }
}

// ==================== PARALLEL DIALER (TWILIO — 213 CALLER ID) ====================
var twilioDevice = null;
var twilioReady = false;
var lineCallSids = {}; // line -> Twilio outbound CallSid
var lineTimers = {};   // line -> timer interval
var lineStartTimes = {}; // line -> call start time
var lineTimeouts = {}; // line -> auto-cleanup timeout
var activeLiveCall = null; // which line has a live connected call
var dialerPhoneMap = {}; // normalized phone -> line number (for matching incoming)
var statusPollInterval = null; // polling interval for call statuses

function extractAreaCode(phone) {
  if (!phone) return '???';
  var digits = phone.replace(/\D/g, '');
  if (digits.length === 10) return digits.substring(0, 3);
  if (digits.length === 11 && digits[0] === '1') return digits.substring(1, 4);
  return '???';
}

function normalizePhoneForMatch(phone) {
  if (!phone) return '';
  var digits = phone.replace(/\D/g, '');
  if (digits.length === 10) return '+1' + digits;
  if (digits.length === 11 && digits[0] === '1') return '+' + digits;
  return '+' + digits;
}

function formatCallTime(seconds) {
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

async function initTwilioDevice() {
  if (twilioDevice && twilioReady) return true;
  if (twilioDevice) { try { twilioDevice.destroy(); } catch(e){} twilioDevice = null; twilioReady = false; }

  // Verify Twilio SDK is loaded
  if (typeof Twilio === 'undefined' || typeof Twilio.Device === 'undefined') {
    console.error('Twilio Voice SDK not loaded — check script tag');
    toast('Twilio SDK failed to load. Check your internet connection and refresh.', 'error');
    return false;
  }

  try {
    console.log('Fetching Twilio access token...');
    var resp = await fetch('/api/twilio/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({ identity: agentIdentity })
    });
    if (!resp.ok) {
      var errText = await resp.text();
      console.error('Twilio token HTTP error:', resp.status, errText);
      toast('Twilio token error (HTTP ' + resp.status + ')', 'error');
      return false;
    }
    var data = await resp.json();
    if (data.error) {
      console.error('Twilio token error:', data.error);
      toast('Twilio token error: ' + data.error, 'error');
      return false;
    }
    console.log('Got Twilio token for identity:', data.identity);

    // Voice SDK v2.x — constructor is synchronous, must call .register() explicitly
    // Use SDK codec constants if available, fall back to string values
    var codecPrefs = (Twilio.Device && Twilio.Device.Codec)
      ? [Twilio.Device.Codec.Opus, Twilio.Device.Codec.PCMU]
      : ['opus', 'pcmu'];
    twilioDevice = new Twilio.Device(data.token, {
      codecPreferences: codecPrefs,
      logLevel: 'info',
      closeProtection: true,
      allowIncomingWhileBusy: true
    });

    // Set up event handlers BEFORE registering
    twilioDevice.on('error', function(err) {
      console.error('Twilio Device error:', err);
      toast('Twilio error: ' + (err.message || 'Unknown'), 'error');
    });

    // CRITICAL: When a lead answers and connect.js bridges them to the browser
    twilioDevice.on('incoming', function(call) {
      console.log('Incoming call! customParameters:', call.customParameters);
      console.log('Incoming call params:', JSON.stringify(call.parameters));

      // Identify which line from custom parameters
      var connLine = null;
      if (call.customParameters && call.customParameters.get) {
        var lineParam = call.customParameters.get('line');
        if (lineParam) connLine = parseInt(lineParam);
      }
      if (!connLine) {
        // Fall back to matching by From phone number
        var fromNum = call.parameters.From || '';
        console.log('Matching by From number:', fromNum);
        for (var n = 1; n <= dialerLineCount; n++) {
          if (dialerLeadMap[n]) {
            var leadPhone = normalizePhoneForMatch(dialerLeadMap[n].phone || dialerLeadMap[n].cell_phone || '');
            if (leadPhone === fromNum || fromNum.indexOf(leadPhone.replace('+1','')) > -1) {
              connLine = n;
              break;
            }
          }
        }
      }
      // If still no match, pick first active line
      if (!connLine) {
        for (var n = 1; n <= dialerLineCount; n++) {
          if (lineCallSids[n] && activeLiveCall !== n) { connLine = n; break; }
        }
      }

      if (activeLiveCall) {
        console.log('Already on line ' + activeLiveCall + ', rejecting incoming on line ' + connLine);
        call.reject();
        return;
      }

      console.log('ACCEPTING call on line ' + connLine);
      call.accept();
      activeLiveCall = connLine || 1;
      var liveLineNum = activeLiveCall;

      // Mark this line as live — show hangup button but NOT outcome form yet
      setLineState(liveLineNum, 'on-call');
      startCallTimer(liveLineNum);
      document.getElementById('lineOutcomes' + liveLineNum).style.display = 'none';
      document.getElementById('lineForm' + liveLineNum).classList.remove('active');
      document.getElementById('lineHangup' + liveLineNum).style.display = 'block';
      (function(){ var _nw = document.getElementById('lineNotesWrap' + liveLineNum); if (_nw) _nw.style.display = 'block'; })();
      toast('CONNECTED — Line ' + liveLineNum + ': ' + (dialerLeadMap[liveLineNum] ? dialerLeadMap[liveLineNum].company_name : 'Lead'), 'success');

      // When the call ends — show outcome form
      call.on('disconnect', function() {
        console.log('Call disconnected on line ' + liveLineNum);
        stopCallTimer(liveLineNum);
        setLineState(liveLineNum, 'call-ended');
        document.getElementById('lineHangup' + liveLineNum).style.display = 'none';
        document.getElementById('lineForm' + liveLineNum).classList.add('active');
      });

      call.on('cancel', function() {
        console.log('Call cancelled on line ' + activeLiveCall);
      });

      // Hang up and clear ALL other lines
      hangupOtherLines(activeLiveCall);
    });

    twilioDevice.on('tokenWillExpire', function() {
      console.log('Twilio token expiring, refreshing...');
      fetch('/api/twilio/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ identity: agentIdentity })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.token) twilioDevice.updateToken(d.token);
      });
    });

    // Register the device — this opens the WebSocket to Twilio
    return await new Promise(function(resolve) {
      var timeoutId = setTimeout(function() {
        console.error('Twilio Device registration timed out');
        toast('Twilio registration timed out. Try refreshing the page.', 'error');
        resolve(false);
      }, 15000);

      twilioDevice.on('registered', function() {
        clearTimeout(timeoutId);
        twilioReady = true;
        console.log('Twilio Device REGISTERED — ready as client:' + agentIdentity);
        resolve(true);
      });

      twilioDevice.on('unregistered', function() {
        console.log('Twilio Device unregistered');
        twilioReady = false;
      });

      twilioDevice.on('registering', function() {
        console.log('Twilio Device registering...');
      });

      // Explicitly register (v2.x requirement)
      twilioDevice.register();
    });
  } catch(e) {
    console.error('Twilio init failed:', e);
    toast('Twilio init failed: ' + e.message, 'error');
    return false;
  }
}

// ==================== SINGLE DIALER ====================
var singleDialCallSid = null;
var singleDialTimerInterval = null;
var singleDialStartTime = null;

async function startSingleDial() {
  var rawNum = document.getElementById('singleDialNumber').value.trim();
  if (!rawNum) { toast('Enter a phone number to dial', 'error'); return; }

  // Normalize phone
  var digits = rawNum.replace(/\D/g, '');
  if (digits.length === 10) digits = '1' + digits;
  if (digits.length === 11 && digits[0] === '1') {
    var phone = '+' + digits;
  } else {
    toast('Enter a valid US phone number (10 digits)', 'error'); return;
  }

  var statusEl = document.getElementById('singleDialStatus');
  var timerEl = document.getElementById('singleDialTimer');
  var dialBtn = document.getElementById('singleDialBtn');
  var hangupBtn = document.getElementById('singleHangupBtn');

  // Init Twilio Device if needed
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<span style="color:var(--warning)">Connecting to Twilio...</span>';
  var ready = await initTwilioDevice();
  if (!ready) {
    statusEl.innerHTML = '<span style="color:var(--danger)">Twilio connection failed</span>';
    return;
  }

  // Place the call
  statusEl.innerHTML = '<span style="color:var(--warning)">Dialing ' + phone + '...</span>';
  dialBtn.style.display = 'none';
  hangupBtn.style.display = 'inline-flex';

  try {
    var resp = await fetch('/api/twilio/dial', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({ to: phone, from: '+12137211724', agentIdentity: agentIdentity, leadId: 'manual', line: 0 })
    });
    var data = await resp.json();
    if (data.error) {
      statusEl.innerHTML = '<span style="color:var(--danger)">' + data.error + '</span>';
      dialBtn.style.display = 'inline-flex';
      hangupBtn.style.display = 'none';
      return;
    }
    singleDialCallSid = data.callSid;
    statusEl.innerHTML = '<span style="color:var(--info)">Ringing...</span>';

    // Poll for status
    var pollCount = 0;
    var pollInterval = setInterval(async function() {
      pollCount++;
      if (pollCount > 20) { clearInterval(pollInterval); return; } // stop after 60s
      try {
        var sr = await fetch('/api/twilio/status?callSid=' + singleDialCallSid, {
          headers: { 'Authorization': 'Bearer ' + currentAccessToken }
        });
        var sd = await sr.json();
        if (sd.statuses && sd.statuses[0]) {
          var s = sd.statuses[0].status;
          if (s === 'in-progress') {
            clearInterval(pollInterval);
            statusEl.innerHTML = '<span style="color:var(--success)">Connected!</span>';
            timerEl.style.display = 'block';
            singleDialStartTime = Date.now();
            singleDialTimerInterval = setInterval(function() {
              var elapsed = Math.floor((Date.now() - singleDialStartTime) / 1000);
              var m = String(Math.floor(elapsed / 60)).padStart(2, '0');
              var sec = String(elapsed % 60).padStart(2, '0');
              timerEl.textContent = m + ':' + sec;
            }, 1000);
          } else if (s === 'completed' || s === 'no-answer' || s === 'busy' || s === 'failed' || s === 'canceled') {
            clearInterval(pollInterval);
            var labels = { completed: 'Call Ended', 'no-answer': 'No Answer', busy: 'Busy', failed: 'Failed', canceled: 'Canceled' };
            statusEl.innerHTML = '<span style="color:var(--text-muted)">' + (labels[s] || s) + '</span>';
            resetSingleDial();
          }
        }
      } catch(e) {}
    }, 3000);
  } catch(e) {
    statusEl.innerHTML = '<span style="color:var(--danger)">Dial failed: ' + e.message + '</span>';
    dialBtn.style.display = 'inline-flex';
    hangupBtn.style.display = 'none';
  }
}

async function hangupSingleDial() {
  if (!singleDialCallSid) return;
  try {
    await fetch('/api/twilio/hangup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({ callSid: singleDialCallSid })
    });
  } catch(e) {}
  var statusEl = document.getElementById('singleDialStatus');
  statusEl.innerHTML = '<span style="color:var(--text-muted)">Call ended</span>';
  resetSingleDial();
}

function resetSingleDial() {
  singleDialCallSid = null;
  if (singleDialTimerInterval) { clearInterval(singleDialTimerInterval); singleDialTimerInterval = null; }
  document.getElementById('singleDialBtn').style.display = 'inline-flex';
  document.getElementById('singleHangupBtn').style.display = 'none';
  setTimeout(function() {
    document.getElementById('singleDialTimer').style.display = 'none';
    document.getElementById('singleDialTimer').textContent = '00:00';
  }, 3000);
}

function setLineState(line, state) {
  var el = document.getElementById('dialerLine' + line);
  if (!el) return;
  el.className = 'dialer-line ' + state;
  var statusEl = document.getElementById('lineStatus' + line);
  if (state === 'ringing') { statusEl.innerHTML = '<span class="line-status active">Ringing...</span>'; }
  else if (state === 'on-call') { statusEl.innerHTML = '<span class="live-indicator"><span class="dot"></span> LIVE</span>'; }
  else if (state === 'voicemail-detected') { statusEl.innerHTML = '<span class="vm-badge">Voicemail</span>'; }
  else if (state === 'call-ended') { statusEl.innerHTML = '<span class="line-status">Ended</span>'; }
  else if (state === 'no-answer') { statusEl.innerHTML = '<span class="line-status">No Answer</span>'; }
  else { statusEl.innerHTML = '<span class="line-status">Idle</span>'; }
}

function startCallTimer(line) {
  lineStartTimes[line] = Date.now();
  var timerEl = document.getElementById('lineTimer' + line);
  if (timerEl) timerEl.style.display = 'block';
  lineTimers[line] = setInterval(function() {
    var elapsed = Math.floor((Date.now() - lineStartTimes[line]) / 1000);
    if (timerEl) timerEl.textContent = formatCallTime(elapsed);
  }, 1000);
}

function stopCallTimer(line) {
  if (lineTimers[line]) { clearInterval(lineTimers[line]); lineTimers[line] = null; }
  var timerEl = document.getElementById('lineTimer' + line);
  if (timerEl) timerEl.style.display = 'none';
}

// Hang up all lines except the connected one
async function hangupOtherLines(keepLine) {
  stopStatusPolling(); // No need to poll while on a live call
  var sidsToKill = [];
  for (var n = 1; n <= dialerLineCount; n++) {
    if (n === keepLine) continue;
    if (lineTimeouts[n]) { clearTimeout(lineTimeouts[n]); lineTimeouts[n] = null; }
    var otherLead = dialerLeadMap[n];
    if (lineCallSids[n]) {
      sidsToKill.push(lineCallSids[n]);
      lineCallSids[n] = null;
    }
    if (otherLead) {
      try {
        sb.from('crm_calls').insert({ lead_id: otherLead.id, status: 'no_answer', disposition: 'no_answer', dialer_line: n, dial_seconds: dialSecFor(n), agent_id: currentUser ? currentUser.id : null });
        sb.from('crm_activities').insert({ lead_id: otherLead.id, type: 'call', description: 'Call dropped — another line connected' });
      } catch(e) {}
      dialerStats.noAnswer++;
    }
    dialerLeadMap[n] = null;
    stopCallTimer(n);
    setLineState(n, 'idle');
    document.getElementById('lineOutcomes' + n).style.display = 'none';
    document.getElementById('lineForm' + n).classList.remove('active');
    document.getElementById('lineHangup' + n).style.display = 'none';
    document.getElementById('lineAreaBadge' + n).innerHTML = '';
    document.getElementById('lineName' + n).textContent = '\u2014';
    document.getElementById('lineCompany' + n).textContent = 'Waiting for live call to end...';
    document.getElementById('linePhone' + n).textContent = '\u2014';
    document.getElementById('lineEmail' + n).textContent = '\u2014';
    document.getElementById('lineDetails' + n).textContent = '\u2014';
    (function(){ var _w = document.getElementById('lineNotesWrap' + n); if (_w) _w.style.display = 'none'; var _t = document.getElementById('lineNotes' + n); if (_t) _t.value = ''; })();
  }
  updateDialerStatsUI();
  // Hang up the actual Twilio calls
  if (sidsToKill.length > 0) {
    try {
      await fetch('/api/twilio/hangup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ callSids: sidsToKill })
      });
      console.log('Hung up other lines:', sidsToKill);
    } catch(e) { console.error('Hangup error:', e); }
  }
}

async function updateDialerLeadCount() {
  var countEl = document.getElementById('dialerLeadCount');
  if (!countEl) return;
  var callList = document.getElementById('dialerCallList') ? document.getElementById('dialerCallList').value : '';

  function buildCount(neverDialedOnly) {
    var q = sb.from('crm_leads').select('*', { count: 'exact', head: true }).not('phone', 'is', null).neq('phone', '').not('do_not_call', 'is', true);
    // Same per-rep scoping as the dial pool: your leads or unassigned only.
    if (currentUser && currentUser.id) q = q.or('assigned_to.is.null,assigned_to.eq.' + currentUser.id);
    if (callList) q = q.eq('call_list', callList);
    if (neverDialedOnly) q = q.is('last_dialed_at', null);
    return q;
  }

  var totRes = await buildCount(false);
  var remRes = await buildCount(true);
  var total = totRes.count || 0;
  var remaining = remRes.count || 0;
  var called = Math.max(0, total - remaining);
  countEl.innerHTML = '<strong>' + remaining.toLocaleString() + '</strong> left to call of ' + total.toLocaleString()
    + (called > 0 ? ' <span class="count-sub">&middot; ' + called.toLocaleString() + ' already called (resuming where you left off)</span>' : '')
    + (callList ? ' <span class="count-sub">(Call List)</span>' : '');
}


function changeDialerLineCount(v) {
  if (dialerRunning) {
    toast('Stop the dialer before changing the line count', 'error');
    var sel = document.getElementById('dialerLineCount'); if (sel) sel.value = dialerLineCount;
    return;
  }
  var n = parseInt(v, 10);

  renderDialer(document.getElementById('pageContent'));
}

// Full ring/dial effort for a line (no talk component) — used for no-answer/dropped rows.
function dialSecFor(line) {
  return lineDialTimes[line] ? Math.max(0, Math.floor((Date.now() - lineDialTimes[line]) / 1000)) : 0;
}
function addMonthsISO(m) {
  var d = new Date(); d.setMonth(d.getMonth() + m); return d.toISOString();
}

// Open the HubSpot meeting scheduler for the prospect on this line, pre-filled with their details
// so the rep can book a demo live on the call without retyping anything.
function openBookMeeting(n) {
  var lead = (typeof dialerLeadMap !== 'undefined' && dialerLeadMap[n]) ? dialerLeadMap[n] : {};
  var qs = [];
  var nm = (lead.contact_name || '').trim();
  if (nm) {
    var parts = nm.split(/\s+/);
    qs.push('firstname=' + encodeURIComponent(parts.shift()));
    if (parts.length) qs.push('lastname=' + encodeURIComponent(parts.join(' ')));
  }
  if (lead.email) qs.push('email=' + encodeURIComponent(lead.email));
  if (lead.company_name) qs.push('company=' + encodeURIComponent(lead.company_name));
  if (lead.phone) qs.push('phone=' + encodeURIComponent(lead.phone));
  var url = 'https://meetings.hubspot.com/kaduna/demo' + (qs.length ? '?' + qs.join('&') : '');
  window.open(url, '_blank', 'noopener,noreferrer');
}

// Schedule a 1-hour-before SMS reminder for a meeting booked on a live line.
async function scheduleMeetingReminder(n) {
  var lead = dialerLeadMap[n];
  if (!lead) { toast('No lead on this line', 'error'); return; }
  var el = document.getElementById('mtgTime' + n);
  var val = el ? el.value : '';
  if (!val) { toast('Pick the meeting date & time first', 'error'); return; }
  var when = new Date(val);
  if (isNaN(when.getTime())) { toast('That date/time looks invalid', 'error'); return; }
  if (when.getTime() <= Date.now()) { toast('That meeting time is already in the past', 'error'); return; }
  var phone = normalizePhoneForMatch(lead.phone || lead.cell_phone || '');
  if (!/^\+1[2-9]\d{9}$/.test(phone)) { toast('This lead has no valid US number to text', 'error'); return; }
  // Respect opt-outs (TCPA): never schedule a text for a lead who has opted out. The edge
  // function re-checks this at send time too; this is fast feedback for the rep.
  if (lead.id) {
    var oc = await sb.from('crm_leads').select('do_not_call, do_not_text, unsubscribed').eq('id', lead.id).maybeSingle();
    if (!oc.error && oc.data && (oc.data.do_not_call || oc.data.do_not_text || oc.data.unsubscribed)) {
      toast('This lead has opted out of contact — no reminder set', 'error'); return;
    }
  }
  var localStr = when.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  var res = await sb.from('crm_meetings').insert({
    lead_id: lead.id || null,
    agent_id: currentUser ? currentUser.id : null,
    client_name: (lead.contact_name || '').trim() || null,
    client_phone: phone,
    meeting_at: when.toISOString(),
    meeting_local_str: localStr,
    reminder_offset_minutes: 60,
    reminder_status: 'pending'
  });
  if (res.error) { toast('Could not set reminder: ' + res.error.message, 'error'); return; }
  toast('Reminder set — client gets a text about 1 hr before ' + localStr, 'success');
  if (el) el.value = '';
}

async function cancelMeeting(id) {
  if (!confirm('Cancel this meeting reminder? The client will not be texted.')) return;
  var res = await sb.from('crm_meetings').update({ reminder_status: 'canceled' }).eq('id', id).in('reminder_status', ['pending', 'sending']);
  if (res.error) { toast('Could not cancel: ' + res.error.message, 'error'); return; }
  toast('Reminder canceled', 'success');
  renderMeetings(document.getElementById('pageContent'));
}

async function startDialer() {
  var statusEl = document.getElementById('twilioStatus');

  // Step 1: Request mic permission
  statusEl.innerHTML = '<span style="color:var(--warning)">Requesting microphone access...</span>';
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    toast('Microphone access denied — the dialer needs your mic to talk to leads', 'error');
    statusEl.innerHTML = '<span style="color:var(--danger)">Microphone blocked — allow it and try again</span>';
    return;
  }

  // Step 2: Init Twilio Device
  statusEl.innerHTML = '<span style="color:var(--warning)">Connecting to Twilio...</span>';
  var ok = await initTwilioDevice();
  if (!ok) {
    toast('Failed to connect to Twilio — check console for errors', 'error');
    statusEl.innerHTML = '<span style="color:var(--danger)">Twilio connection failed</span>';
    return;
  }

  statusEl.innerHTML = '<span style="color:var(--accent)">Connected — calling leads...</span>';

  dialerRunning = true;
  activeLiveCall = null;
  // Don't reset stats — they persist across sessions for the week
  dialerUsedIds = new Set();
  document.getElementById('dialerStartBtn').style.display = 'none';
  document.getElementById('dialerStopBtn').style.display = '';

  // Create dialer session in Supabase
  try {
    var sessRes = await sb.from('crm_dialer_sessions').insert({ status: 'active', lines_active: dialerLineCount, agent_id: currentUser ? currentUser.id : null }).select('id').single();
    dialerSessionId = sessRes.data ? sessRes.data.id : null;
  } catch(e) { dialerSessionId = null; }

  await loadDialerLeads();
}

async function stopDialer() {
  dialerRunning = false;
  activeLiveCall = null;
  stopStatusPolling();
  document.getElementById('dialerStartBtn').style.display = '';
  document.getElementById('dialerStopBtn').style.display = 'none';
  var statusEl = document.getElementById('twilioStatus');
  if (statusEl) statusEl.textContent = '';

  // Collect all active call SIDs to hang up
  var sidsToKill = [];
  for (var n = 1; n <= dialerLineCount; n++) {
    if (lineCallSids[n]) { sidsToKill.push(lineCallSids[n]); lineCallSids[n] = null; }
    if (lineTimeouts[n]) { clearTimeout(lineTimeouts[n]); lineTimeouts[n] = null; }
    stopCallTimer(n);
    setLineState(n, 'idle');
    document.getElementById('lineOutcomes' + n).style.display = 'none';
    document.getElementById('lineForm' + n).classList.remove('active');
    document.getElementById('lineHangup' + n).style.display = 'none';
    document.getElementById('lineAreaBadge' + n).innerHTML = '';
    document.getElementById('lineName' + n).textContent = '\u2014';
    document.getElementById('lineCompany' + n).textContent = 'Waiting...';
    document.getElementById('linePhone' + n).textContent = '\u2014';
    document.getElementById('lineEmail' + n).textContent = '\u2014';
    document.getElementById('lineDetails' + n).textContent = '\u2014';
    (function(){ var _w = document.getElementById('lineNotesWrap' + n); if (_w) _w.style.display = 'none'; var _t = document.getElementById('lineNotes' + n); if (_t) _t.value = ''; })();
  }

  // Hang up any active Twilio calls
  if (sidsToKill.length > 0) {
    try {
      await fetch('/api/twilio/hangup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ callSids: sidsToKill })
      });
    } catch(e) {}
  }

  // Disconnect Twilio Device
  if (twilioDevice) {
    try { twilioDevice.disconnectAll(); } catch(e) {}
  }

  toast('Dialer session ended');
}

function buildDialerQuery() {
  var callList = document.getElementById('dialerCallList') ? document.getElementById('dialerCallList').value : '';
  var query = sb.from('crm_leads').select('*').not('phone', 'is', null).neq('phone', '').not('do_not_call', 'is', true);
  // Per-rep scoping: dial only leads assigned to you or unassigned — never another
  // rep's assigned leads, even if a list name is selected manually.
  if (currentUser && currentUser.id) query = query.or('assigned_to.is.null,assigned_to.eq.' + currentUser.id);
  // The Call List IS the filter now — every lead belongs to a curated, per-rep list.
  if (callList) query = query.eq('call_list', callList);
  return query;
}

async function loadDialerLeads() {
  if (!dialerRunning) return;
  activeLiveCall = null;
  dialerPhoneMap = {};

  // Resume where we left off: never-dialed leads first (last_dialed_at NULLS FIRST), then by score.
  var res = await buildDialerQuery()
    .order('last_dialed_at', { ascending: true, nullsFirst: true })
    .order('lead_score', { ascending: false })
    .limit(500);
  console.log('Dialer query:', res.data ? res.data.length + ' leads found' : 'error', res.error);
  var data = (res.data || []).filter(function(l) { return !dialerUsedIds.has(l.id); }).slice(0, dialerLineCount);

  if (data.length === 0) {
    toast('No more eligible leads. Try different filters.', 'error');
    stopDialer();
    return;
  }

  // Mark this batch as dialed so next time we resume past them (persists across sessions/reloads),
  // then refresh the "X left to call" pill so it visibly counts down by the batch size as you dial.
  try {
    sb.from('crm_leads').update({ last_dialed_at: new Date().toISOString() }).in('id', data.map(function(l){ return l.id; }))
      .then(function(){ updateDialerLeadCount(); }, function(){});
  } catch(e) {}

  // Load leads into UI and dial all simultaneously
  var dialPromises = [];
  for (var i = 0; i < data.length; i++) {
    var lead = data[i];
    var n = i + 1;
    lineStartTimes[n] = 0; lineDialTimes[n] = 0;  // fresh batch — never carry prior timing
    dialerLeadMap[n] = lead;
    dialerUsedIds.add(lead.id);
    dialerStats.total++;

    var phone = lead.phone || lead.cell_phone || '';
    var ac = extractAreaCode(phone);
    document.getElementById('lineName' + n).textContent = lead.contact_name || 'Unknown';
    document.getElementById('lineCompany' + n).textContent = lead.company_name || '';
    document.getElementById('linePhone' + n).textContent = phone || '\u2014';
    document.getElementById('lineEmail' + n).textContent = lead.email || '\u2014';
    document.getElementById('lineDetails' + n).textContent = (lead.trucks || lead.power_units || 0) + ' trucks | ' + (lead.state || 'N/A') + ' | Score: ' + (lead.lead_score || 0);
    document.getElementById('lineAreaBadge' + n).innerHTML = '<span class="area-code-badge match">Calling from (213)...</span>';

    setLineState(n, 'ringing');
    document.getElementById('lineOutcomes' + n).style.display = 'none';
    document.getElementById('lineForm' + n).classList.remove('active');
    document.getElementById('lineHangup' + n).style.display = 'none';
    (function(){ var _w = document.getElementById('lineNotesWrap' + n); if (_w) _w.style.display = 'none'; var _t = document.getElementById('lineNotes' + n); if (_t) _t.value = ''; })();

    // Map phone for incoming connection matching
    dialerPhoneMap[normalizePhoneForMatch(phone)] = n;

    // Dial via Twilio API
    dialPromises.push(dialLineViaTwilio(n, lead, phone));
  }

  updateDialerStatsUI();

  // Fire all 3 calls in parallel
  await Promise.allSettled(dialPromises);

  // Start polling for call statuses (voicemail, busy, etc.)
  startStatusPolling();
}

async function dialLineViaTwilio(line, lead, phone) {
  try {
    lineDialTimes[line] = Date.now();
    console.log('Line ' + line + ': Dialing ' + phone + '...');
    var resp = await fetch('/api/twilio/dial', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({
        to: phone,
        leadId: lead.id,
        line: line,
        agentIdentity: agentIdentity
      })
    });
    var data = await resp.json();
    if (data.error) {
      console.error('Line ' + line + ' dial error:', data.error);
      setLineState(line, 'call-ended');
      document.getElementById('lineAreaBadge' + line).innerHTML = '<span class="area-code-badge fallback">Dial failed</span>';
      dialerStats.noAnswer++;
      updateDialerStatsUI();
      return;
    }

    lineCallSids[line] = data.callSid;
    console.log('Line ' + line + ': Call initiated ' + data.callSid);

    // Set 35-second timeout — if no answer by then, auto-mark and move on
    lineTimeouts[line] = setTimeout(function() {
      if (lineCallSids[line] && activeLiveCall !== line) {
        console.log('Line ' + line + ': Timeout — no answer');
        handleLineTimeout(line);
      }
    }, 35000);

  } catch(e) {
    console.error('Line ' + line + ' dial failed:', e);
    setLineState(line, 'call-ended');
    document.getElementById('lineAreaBadge' + line).innerHTML = '<span class="area-code-badge fallback">Error</span>';
  }
}

// Poll Twilio for call statuses to detect voicemail, busy, completed, etc.
function startStatusPolling() {
  if (statusPollInterval) return;
  statusPollInterval = setInterval(pollCallStatuses, 3000);
}

function stopStatusPolling() {
  if (statusPollInterval) { clearInterval(statusPollInterval); statusPollInterval = null; }
}

async function pollCallStatuses() {
  if (!dialerRunning) { stopStatusPolling(); return; }

  // Collect active call SIDs
  var sids = [];
  var sidToLine = {};
  for (var n = 1; n <= dialerLineCount; n++) {
    if (lineCallSids[n] && activeLiveCall !== n) {
      sids.push(lineCallSids[n]);
      sidToLine[lineCallSids[n]] = n;
    }
  }
  if (sids.length === 0) { stopStatusPolling(); return; }

  try {
    var url = '/api/twilio/status?' + sids.map(function(s) { return 'callSid=' + encodeURIComponent(s); }).join('&');
    var resp = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + currentAccessToken }
    });
    if (!resp.ok) return;
    var data = await resp.json();
    if (!data.statuses) return;

    for (var sid in data.statuses) {
      var info = data.statuses[sid];
      var line = sidToLine[sid];
      if (!line) continue;

      // Update UI based on status
      if (info.status === 'ringing') {
        setLineState(line, 'ringing');
      } else if (info.status === 'in-progress') {
        // Call answered — the incoming event should handle this via Twilio Device
        // But if answeredBy is machine, mark as voicemail
        if (info.answeredBy && info.answeredBy.indexOf('machine') > -1) {
          console.log('Line ' + line + ': Voicemail detected via polling (answeredBy=' + info.answeredBy + ')');
          handleVoicemailDetected(line);
        }
      } else if (info.status === 'completed' || info.status === 'busy' || info.status === 'no-answer' || info.status === 'canceled' || info.status === 'failed') {
        console.log('Line ' + line + ': Call ended — ' + info.status + (info.answeredBy ? ' (answeredBy=' + info.answeredBy + ')' : ''));
        if (info.answeredBy && info.answeredBy.indexOf('machine') > -1) {
          handleVoicemailDetected(line);
        } else if (info.status === 'busy') {
          handleLineBusy(line);
        } else if (info.status === 'completed' && activeLiveCall !== line) {
          // Call completed but wasn't bridged to agent — likely voicemail drop or short call
          handleLineCompleted(line, info);
        } else if (info.status === 'no-answer' || info.status === 'canceled' || info.status === 'failed') {
          handleLineNoAnswer(line, info.status);
        }
      }
    }
  } catch(e) {
    console.error('Status poll error:', e);
  }
}

function handleVoicemailDetected(line) {
  if (lineTimeouts[line]) { clearTimeout(lineTimeouts[line]); lineTimeouts[line] = null; }
  lineCallSids[line] = null;
  setLineState(line, 'voicemail-detected');
  document.getElementById('lineAreaBadge' + line).innerHTML = '<span class="area-code-badge fallback">VM Drop</span>';
  dialerStats.voicemail++;
  dialerStats.dialSec = (dialerStats.dialSec || 0) + dialSecFor(line);
  dialerStats.totalDialSec = (dialerStats.dialSec || 0) + (dialerStats.talkSec || 0);
  updateDialerStatsUI();

  var lead = dialerLeadMap[line];
  if (lead) {
    try {
      sb.from('crm_calls').insert({ lead_id: lead.id, status: 'voicemail', disposition: 'voicemail_left', dialer_line: line, dial_seconds: dialSecFor(line), agent_id: currentUser ? currentUser.id : null });
      sb.from('crm_activities').insert({ lead_id: lead.id, type: 'call', description: 'Call: voicemail detected, message dropped' });
      sb.from('crm_leads').update({ last_contacted_at: new Date().toISOString() }).eq('id', lead.id);
    } catch(e) {}
  }
  checkAllLinesDone();
}

function handleLineCompleted(line, info) {

function checkAllLinesDone() {
  var anyActive = false;
  for (var n = 1; n <= dialerLineCount; n++) {
    if (lineCallSids[n] || activeLiveCall === n) { anyActive = true; break; }
  }
  if (!anyActive && dialerRunning && !activeLiveCall) {
    stopStatusPolling();
    console.log('All lines done — loading next batch');
    setTimeout(function() { loadDialerLeads(); }, 1500);
  }
}

async function handleLineTimeout(line) {
  var lead = dialerLeadMap[line];
  if (!lead) return;

  // Hang up the Twilio call
  if (lineCallSids[line]) {
    try {
      await fetch('/api/twilio/hangup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ callSid: lineCallSids[line] })
      });
    } catch(e) {}
    lineCallSids[line] = null;
  }

  setLineState(line, 'no-answer');
  document.getElementById('lineAreaBadge' + line).innerHTML = '<span class="area-code-badge fallback">No answer</span>';
  dialerStats.noAnswer++;
  dialerStats.dialSec = (dialerStats.dialSec || 0) + dialSecFor(line);
  dialerStats.totalDialSec = (dialerStats.dialSec || 0) + (dialerStats.talkSec || 0);
  updateDialerStatsUI();

  try {
    await sb.from('crm_calls').insert({ lead_id: lead.id, status: 'no_answer', disposition: 'no_answer', dialer_line: line, dial_seconds: dialSecFor(line), agent_id: currentUser ? currentUser.id : null });
    await sb.from('crm_activities').insert({ lead_id: lead.id, type: 'call', description: 'Call: no_answer (timeout)' });
    await sb.from('crm_leads').update({ last_contacted_at: new Date().toISOString() }).eq('id', lead.id);
  } catch(e) {}

  checkAllLinesDone();
}

async function hangupLiveCall(line) {
  // End the active Twilio call on this line
  if (lineCallSids[line]) {
    try {
      await fetch('/api/twilio/hangup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ callSid: lineCallSids[line] })
      });
    } catch(e) {}
    lineCallSids[line] = null;
  }
  // Also disconnect the browser audio
  if (twilioDevice) {
    try { twilioDevice.disconnectAll(); } catch(e) {}
  }
  stopCallTimer(line);
  document.getElementById('lineHangup' + line).style.display = 'none';
  // Show the save form so agent can log the result
  document.getElementById('lineForm' + line).classList.add('active');
  setLineState(line, 'call-ended');
}

async function saveCallResult(line, forcedDispo) {
  var lead = dialerLeadMap[line];
  if (!lead) return;

  var selEl = document.getElementById('lineOutcomeSelect' + line);
  var dispo = forcedDispo || (selEl ? selEl.value : 'not_interested');
  var notesEl = document.getElementById('lineNotes' + line);
  var notes = notesEl ? notesEl.value : '';

  // Talk time (since connect) + ring/dial time (call placed -> connect)
  var talkSec = lineStartTimes[line] ? Math.floor((Date.now() - lineStartTimes[line]) / 1000) : 0;
  var dialSec = lineDialTimes[line] ? Math.max(0, Math.floor((Date.now() - lineDialTimes[line]) / 1000) - talkSec) : 0;

  // Status derived from disposition (No Answer / Voicemail are NOT "completed/connected")
  var callStatus = (dispo === 'no_answer') ? 'no_answer' : (dispo === 'voicemail_left' ? 'voicemail' : 'completed');

  // Live session stats
  if (callStatus === 'completed') dialerStats.connected = (dialerStats.connected || 0) + 1;
  else if (callStatus === 'no_answer') dialerStats.noAnswer = (dialerStats.noAnswer || 0) + 1;
  else if (callStatus === 'voicemail') dialerStats.voicemail = (dialerStats.voicemail || 0) + 1;
  if (dispo === 'booked') dialerStats.booked = (dialerStats.booked || 0) + 1;
  if (dispo === 'booked' || dispo === 'already_insured') dialerStats.interested = (dialerStats.interested || 0) + 1;
  dialerStats.talkSec = (dialerStats.talkSec || 0) + talkSec;
  dialerStats.dialSec = (dialerStats.dialSec || 0) + dialSec;
  dialerStats.totalDialSec = (dialerStats.dialSec || 0) + (dialerStats.talkSec || 0);

  // Hang up Twilio call if still active
  if (lineCallSids[line]) {
    try {
      await fetch('/api/twilio/hangup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
        body: JSON.stringify({ callSid: lineCallSids[line] })
      });
    } catch(e) {}
    lineCallSids[line] = null;
  }
  if (twilioDevice) { try { twilioDevice.disconnectAll(); } catch(e) {} }
  stopCallTimer(line);
  activeLiveCall = null;

  // Map disposition -> stage / follow-up / DNC + a VALID call_outcome enum value (if any).
  var leadUpdate = { last_contacted_at: new Date().toISOString() };
  var newStage = null, outcomeEnum = null;
  if (dispo === 'booked') { newStage = (lead.stage === 'prospect' || lead.stage === 'lead') ? 'info_pending' : lead.stage; outcomeEnum = 'interested'; }
  else if (dispo === 'not_interested') { outcomeEnum = 'not_interested'; }
  else if (dispo === 'wrong_number') { outcomeEnum = 'wrong_number'; }
  else if (dispo === 'callback_3mo') { outcomeEnum = 'callback'; leadUpdate.next_follow_up = addMonthsISO(3); }
  else if (dispo === 'callback_6mo') { outcomeEnum = 'callback'; leadUpdate.next_follow_up = addMonthsISO(6); }
  else if (dispo === 'dnc') { leadUpdate.do_not_call = true; }

  // Dead-end dispositions: drop the lead from the dial list (don't call again) and stamp the
  // reason + notes onto the lead record so it's ready to push/export to HubSpot.
  var REMOVE_DISPOS = ['not_interested', 'wrong_number', 'bad_number', 'fax_number', 'dnc'];
  if (REMOVE_DISPOS.indexOf(dispo) !== -1) {
    leadUpdate.do_not_call = true;
    var _stamp = new Date().toLocaleDateString();
    leadUpdate.notes = (lead.notes ? lead.notes + '\n' : '') + '[' + _stamp + ' — ' + (DISPO_LABEL[dispo] || dispo) + (notes ? ': ' + notes : '') + ']';
  }

  var callRow = {
    lead_id: lead.id, status: callStatus, notes: notes, dialer_line: line,
    duration_seconds: (callStatus === 'completed' ? talkSec : 0), dial_seconds: dialSec, disposition: dispo,
    answered_at: (callStatus === 'completed' && lineStartTimes[line]) ? new Date(lineStartTimes[line]).toISOString() : null,
    agent_id: currentUser ? currentUser.id : null
  };
  if (outcomeEnum) callRow.outcome = outcomeEnum;

  try {
    await sb.from('crm_calls').insert(callRow);
    await sb.from('crm_activities').insert({
      lead_id: lead.id, type: 'call',
      description: 'Call (' + formatCallTime(talkSec) + '): ' + (DISPO_LABEL[dispo] || dispo) + (notes ? ' - ' + notes : '')
    });
    if (newStage && newStage !== lead.stage) leadUpdate.stage = newStage;
    await sb.from('crm_leads').update(leadUpdate).eq('id', lead.id);
    if (leadUpdate.stage) {
      await sb.from('crm_activities').insert({ lead_id: lead.id, type: 'stage_change', description: 'Stage changed to ' + leadUpdate.stage + ' (from dialer)' });
    }
  } catch(e) { console.error('Save call error:', e); }

  var _f = document.getElementById('lineForm' + line); if (_f) _f.classList.remove('active');
  var _nw = document.getElementById('lineNotesWrap' + line); if (_nw) _nw.style.display = 'none';
  if (notesEl) notesEl.value = '';
  toast('Saved: ' + (DISPO_LABEL[dispo] || dispo) + (leadUpdate.stage ? ' — moved to ' + leadUpdate.stage.replace(/_/g, ' ') : ''));
  updateDialerStatsUI();

  // After the call is logged, reload the lines with fresh leads
  await loadDialerLeads();
}

function updateDialerStatsUI() {
  var setT = function(id, val) { var e = document.getElementById(id); if (e) e.textContent = val; };
  setT('statTotal', dialerStats.total || 0);
  setT('statConnected', dialerStats.connected || 0);
  setT('statNoAnswer', dialerStats.noAnswer || 0);
  setT('statVoicemail', dialerStats.voicemail || 0);
  setT('statInterested', dialerStats.interested || 0);
  setT('statBooked', dialerStats.booked || 0);
  var rate = dialerStats.total > 0 ? Math.round((dialerStats.connected / dialerStats.total) * 100) : 0;
  setT('statConnectRate', rate + '%');
  setT('statDialTime', formatDialTime(dialerStats.totalDialSec || 0));
}

async function sendTestCampaign(campaignId) {
  var email = prompt('Send a test email to:', 'cohua666@gmail.com');
  if (!email) return;

  toast('Sending test email to ' + email + '...', 'info');
  try {
    var resp = await fetch('/api/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({ campaignId: campaignId, testMode: true, testEmail: email })
    });
    var data = await resp.json();
    if (data.error) {
      toast('Test send failed: ' + data.error, 'error');
    } else {
      toast('Test email sent to ' + email + '!', 'success');
    }
  } catch(e) {
    toast('Failed to send test: ' + e.message, 'error');
  }
}

async function sendLiveCampaign(campaignId, recipientCount) {
  if (recipientCount > 100) {
    var confirmed = confirm('This will send to the first 100 leads (warm-up limit). The campaign targets ' + recipientCount + ' total leads — subsequent batches can be sent later.\n\nProceed?');
  } else {
    var confirmed = confirm('Send this campaign to ' + recipientCount + ' leads?\n\nThis cannot be undone.');
  }
  if (!confirmed) return;

  toast('Sending campaign to leads... this may take a minute', 'info');
  closeModal();

  try {
    var resp = await fetch('/api/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + currentAccessToken },
      body: JSON.stringify({ campaignId: campaignId })
    });
    var data = await resp.json();
    if (data.error) {
      toast('Campaign send failed: ' + data.error, 'error');
    } else {
      toast('Campaign sent! ' + data.sent + ' emails delivered, ' + data.failed + ' failed.', 'success');
      renderEmailCampaigns(document.getElementById('pageContent'));
    }
  } catch(e) {
    toast('Campaign send error: ' + e.message, 'error');
  }
}

  updateSidebarStats();

// ==================== IMPORT LEADS (CSV) ====================
// Master-only. Buyers upload a CSV, map columns, and get a ready-to-dial call
// list. Duplicate phones are skipped by default (checked server-side against
// BOTH phone and cell_phone in any stored format via crm_find_existing_phones).
var _csvImport = { rows: [], headers: [], mapping: {}, fileName: '' };
var CSV_TARGET_FIELDS = [
  ['contact_name', 'Contact name'],
  ['company_name', 'Company'],
  ['phone', 'Phone (required)'],
  ['email', 'Email'],
  ['city', 'City'],
  ['state', 'State'],
  ['zip', 'ZIP'],
  ['notes', 'Notes']
];
var CSV_SYNONYMS = {
  phone: ['phone','phonenumber','phone1','primaryphone','mobile','mobilephone','mobilenumber','cell','cellphone','telephone','tel','number','directphone','workphone'],
  contact_name: ['name','contactname','contact','fullname','leadname','person','ownername','firstname'],
  company_name: ['company','companyname','business','businessname','organization','organisation','org','account','employer'],
  email: ['email','emailaddress','mail','workemail'],
  city: ['city','town'],
  state: ['state','st','region','province'],
  zip: ['zip','zipcode','postal','postalcode'],
  notes: ['notes','note','comments','comment','description','remarks']
};

// Minimal CSV parser: quoted fields, "" escapes, CRLF/LF, BOM. Returns array of row-arrays.
function parseCSV(text) {
  if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [], row = [], field = '', inQ = false, i = 0, ch;
  while (i < text.length) {
    ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(field); field = ''; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(field); field = ''; rows.push(row); row = []; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function(r) { return r.some(function(c) { return String(c).trim() !== ''; }); });
}

function csvNormHeader(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function csvPrettyPhone(d10) { return '(' + d10.slice(0, 3) + ') ' + d10.slice(3, 6) + '-' + d10.slice(6); }

function csvAutoMap(headers) {
  var mapping = {}, used = {};
  CSV_TARGET_FIELDS.forEach(function(tf) {
    var field = tf[0], syns = CSV_SYNONYMS[field] || [];
    for (var i = 0; i < headers.length; i++) {
      if (used[i]) continue;
      if (syns.indexOf(csvNormHeader(headers[i])) > -1) { mapping[field] = i; used[i] = true; break; }
    }
  });
  return mapping;
}

  html += '</div>';

  html += '<div class="session-stats" id="csvStep2" style="margin-bottom:16px;display:none;"><h3>2 &mdash; Map your columns</h3>';
  html += '<div id="csvFileInfo" style="font-size:12px;color:var(--text-secondary);margin:6px 0 12px;"></div>';
  html += '<div class="csv-map-grid" id="csvMapGrid"></div>';
  html += '<div style="margin-top:14px;overflow-x:auto;"><table class="csv-preview" id="csvPreview"></table></div>';
  html += '</div>';

  html += '<div class="session-stats csv-import-opts" id="csvStep3" style="display:none;"><h3>3 &mdash; Import</h3>';
  html += '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">';

  html += '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);padding-bottom:10px;"><input type="checkbox" id="csvSkipDupes" checked> Skip phone numbers already in the CRM</label>';
  html += '<button class="btn btn-primary" id="csvImportBtn" style="padding:10px 22px;">Import Leads</button>';
  html += '</div>';
  html += '<div id="csvProgress" style="display:none;margin-top:16px;max-width:460px;"><div class="progress-bar"><div class="progress-fill" id="csvProgressFill" style="width:0%"></div></div><div id="csvProgressText" style="font-size:12px;color:var(--text-muted);margin-top:6px;"></div></div>';

  html += '</div>';

  el.innerHTML = html;

  // Assign-to dropdown + existing list names (soft duplicate-name warning)
  var existingLists = {};
  try {
    var results = await Promise.all([
      sb.from('profiles').select('id, full_name, email, active').order('created_at'),
      sb.from('crm_leads').select('call_list').not('call_list', 'is', null).limit(5000)
    ]);
    var assignSel = document.getElementById('csvAssign');
    (results[0].data || []).filter(function(p) { return p.active !== false; }).forEach(function(p) {
      var o = document.createElement('option'); o.value = p.id; o.textContent = p.full_name || p.email; assignSel.appendChild(o);

  });

function csvImportHandleFile(file) {
  if (file.size > 15 * 1024 * 1024) { toast('File too large — max 15 MB', 'error'); return; }
  var reader = new FileReader();
  reader.onload = function() {
    var rows = parseCSV(String(reader.result || ''));
    if (rows.length < 2) { toast('That file has no data rows (the first row must be headers)', 'error'); return; }
    if (rows.length - 1 > 25000) { toast('Too many rows — max 25,000 leads per upload', 'error'); return; }
    _csvImport.rows = rows;
    _csvImport.headers = rows[0].map(function(h) { return String(h).trim(); });
    _csvImport.mapping = csvAutoMap(_csvImport.headers);
    _csvImport.fileName = file.name;
    document.getElementById('csvFileInfo').innerHTML = '<strong>' + escHtml(file.name) + '</strong> &middot; ' + (rows.length - 1).toLocaleString() + ' rows';
    csvRenderMapping();
    document.getElementById('csvStep2').style.display = '';
    document.getElementById('csvStep3').style.display = '';
    document.getElementById('csvSummary').style.display = 'none';
  };
  reader.onerror = function() { toast('Could not read that file', 'error'); };
  reader.readAsText(file);
}

function csvRenderMapping() {
  var grid = document.getElementById('csvMapGrid');
  var opts = '<option value="">(skip)</option>';
  _csvImport.headers.forEach(function(h, i) { opts += '<option value="' + i + '">' + escHtml(h || ('Column ' + (i + 1))) + '</option>'; });
  var html = '';
  CSV_TARGET_FIELDS.forEach(function(tf) {
    html += '<label>' + tf[1] + '</label>';
    html += '<select data-field="' + tf[0] + '">' + opts + '</select>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('select').forEach(function(sel) {
    var f = sel.getAttribute('data-field');
    if (_csvImport.mapping[f] != null) sel.value = String(_csvImport.mapping[f]);
    sel.addEventListener('change', function() {
      if (this.value === '') delete _csvImport.mapping[f];
      else _csvImport.mapping[f] = parseInt(this.value, 10);
      csvRenderPreview();
    });
  });
  csvRenderPreview();
}

function csvRenderPreview() {
  var tbl = document.getElementById('csvPreview');
  var fields = CSV_TARGET_FIELDS.filter(function(tf) { return _csvImport.mapping[tf[0]] != null; });
  if (!fields.length) { tbl.innerHTML = '<tr><td style="color:var(--text-muted);">Map at least the Phone column to continue.</td></tr>'; return; }
  var html = '<tr>' + fields.map(function(tf) { return '<th>' + tf[1] + '</th>'; }).join('') + '</tr>';
  _csvImport.rows.slice(1, 6).forEach(function(row) {
    html += '<tr>' + fields.map(function(tf) { return '<td>' + escHtml(String(row[_csvImport.mapping[tf[0]]] || '')) + '</td>'; }).join('') + '</tr>';
  });
  tbl.innerHTML = html;
}

async function runCsvImport() {
  var btn = document.getElementById('csvImportBtn');
  var listName = document.getElementById('csvListName').value.trim();
  var assignTo = document.getElementById('csvAssign').value || null;
  var skipDupes = document.getElementById('csvSkipDupes').checked;
  if (_csvImport.mapping.phone == null) { toast('Map the Phone column first — the dialer needs a number to call', 'error'); return; }
  if (!listName) { toast('Give this list a name', 'error'); return; }

  // Build + validate rows: normalize phone, drop invalid + in-file duplicates.
  var m = _csvImport.mapping;
  function cell(row, f) { return m[f] != null ? String(row[m[f]] || '').trim() : ''; }
  var items = [], invalid = 0, inFileDupes = 0, seen = {};
  _csvImport.rows.slice(1).forEach(function(row) {
    var digits = cell(row, 'phone').replace(/\D/g, '');
    if (digits.length === 11 && digits[0] === '1') digits = digits.slice(1);
    if (!/^[2-9]\d{9}$/.test(digits)) { invalid++; return; }
    if (seen[digits]) { inFileDupes++; return; }
    seen[digits] = true;
    var st = cell(row, 'state').toUpperCase();
    items.push({
      _norm: digits,
      phone: csvPrettyPhone(digits),
      contact_name: cell(row, 'contact_name') || null,
      company_name: cell(row, 'company_name') || null,
      email: cell(row, 'email') || null,
      city: cell(row, 'city') || null,
      state: (st.length === 2 ? st : (cell(row, 'state') || null)),
      zip: cell(row, 'zip') || null,
      notes: cell(row, 'notes') || null,
      call_list: listName,
      assigned_to: assignTo,
      source: 'csv_upload',
      lead_score: 0
    });
  });

  if (!items.length) { toast('No importable rows — every row was missing a valid US phone number', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Importing…';
  var prog = document.getElementById('csvProgress'), fill = document.getElementById('csvProgressFill'), ptext = document.getElementById('csvProgressText');
  prog.style.display = ''; fill.style.width = '2%'; ptext.textContent = 'Preparing…';

  try {
    // Skip phones already in the CRM (matches any stored format, phone OR cell_phone).
    var crmDupes = 0;
    if (skipDupes) {
      var existing = {};
      for (var i = 0; i < items.length; i += 500) {
        var chunk = items.slice(i, i + 500).map(function(it) { return it._norm; });
        ptext.textContent = 'Checking for existing numbers… ' + Math.min(i + 500, items.length).toLocaleString() + ' / ' + items.length.toLocaleString();
        var rres = await sb.rpc('crm_find_existing_phones', { p_phones: chunk });
        if (rres.error) throw rres.error;
        (rres.data || []).forEach(function(p) { existing[typeof p === 'string' ? p : (p && p.crm_find_existing_phones)] = true; });
      }
      var kept = items.filter(function(it) { return !existing[it._norm]; });
      crmDupes = items.length - kept.length;
      items = kept;
    }

    // Insert in batches of 500.
    var inserted = 0;
    for (var j = 0; j < items.length; j += 500) {
      var batch = items.slice(j, j + 500).map(function(it) { var o = {}; for (var k in it) { if (k !== '_norm') o[k] = it[k]; } return o; });
      var ires = await sb.from('crm_leads').insert(batch);
      if (ires.error) throw ires.error;
      inserted += batch.length;
      fill.style.width = Math.round(5 + 95 * inserted / Math.max(items.length, 1)) + '%';
      ptext.textContent = 'Importing… ' + inserted.toLocaleString() + ' / ' + items.length.toLocaleString();
    }

    fill.style.width = '100%'; ptext.textContent = 'Done';
    _dialerCallListsCache = null;  // the new list shows up in the dialer immediately

    var sm = document.getElementById('csvSummary');
    sm.style.display = '';
    sm.innerHTML = '<div style="padding:14px 16px;border:1px solid var(--accent-border);background:var(--accent-dim);border-radius:10px;font-size:13px;">'
      + '<strong style="color:var(--accent);">' + inserted.toLocaleString() + ' lead' + (inserted === 1 ? '' : 's') + ' imported</strong> into "' + escHtml(listName) + '"'
      + (crmDupes ? ' &middot; ' + crmDupes.toLocaleString() + ' skipped (already in the CRM)' : '')
      + (inFileDupes ? ' &middot; ' + inFileDupes.toLocaleString() + ' duplicate' + (inFileDupes === 1 ? '' : 's') + ' within the file' : '')
      + (invalid ? ' &middot; ' + invalid.toLocaleString() + ' row' + (invalid === 1 ? '' : 's') + ' without a valid US phone' : '')
      + '<br><span style="color:var(--text-secondary);">Open the Parallel Dialer and pick "' + escHtml(listName) + '" to start calling.</span></div>';
    toast(inserted ? 'Imported ' + inserted.toLocaleString() + ' leads' : 'Nothing imported — all rows were duplicates', inserted ? 'success' : 'error');
  } catch (err) {
    console.error('CSV import failed:', err);
    toast('Import failed: ' + (err.message || 'unknown error'), 'error');
    ptext.textContent = 'Import stopped: ' + (err.message || 'unknown error');
    _dialerCallListsCache = null;  // earlier batches may have inserted rows — don't serve a stale list
  }
  btn.disabled = false; btn.textContent = 'Import Leads';
}

// ==================== CALL HISTORY ====================
// Last 100 calls, most recent first. RLS scopes it automatically:
// masters see the whole team's calls, agents see only their own.
async function renderCallHistory(el) {
  el.innerHTML = '<div class="page-header"><h2>Call History</h2><p>The last 100 calls' + (isMaster() ? ' across the team' : ' you made') + ' &mdash; most recent first.</p></div><div id="callHistoryBody">Loading&hellip;</div>';

  var res = await sb.from('crm_calls')
    .select('created_at, duration_seconds, status, disposition, agent_id, crm_leads(company_name, contact_name, phone)')
    .order('created_at', { ascending: false })
    .limit(100);
  var calls = res.data || [];

  var agentName = {};
  if (isMaster() && calls.length) {
    try {
      var pr = await sb.from('profiles').select('id, full_name, email');
      (pr.data || []).forEach(function(p){ agentName[p.id] = p.full_name || p.email; });
    } catch(e) {}
  }

  var STATUS_LABEL = { completed: 'Connected', no_answer: 'No Answer', voicemail: 'Voicemail', busy: 'Busy', failed: 'Failed', initiated: 'Initiated', ringing: 'Ringing', connected: 'Connected' };

  var body = document.getElementById('callHistoryBody');
  if (!calls.length) {
    body.innerHTML = '<div class="session-stats"><div style="color:var(--text-muted);padding:12px;">No calls yet &mdash; they\'ll appear here as soon as you start dialing.</div></div>';
    return;
  }

  var html = '<div class="session-stats"><div style="overflow-x:auto;"><table class="team-perf">';
  html += '<thead><tr><th>When</th><th>Lead</th><th>Duration</th><th>Disposition</th>' + (isMaster() ? '<th>Agent</th>' : '') + '</tr></thead><tbody>';
  calls.forEach(function(c) {
    var d = new Date(c.created_at);
    var when = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    var lead = c.crm_leads || {};
    var who = escHtml(lead.contact_name || lead.company_name || '—');
    var sub = escHtml([(lead.contact_name && lead.company_name) ? lead.company_name : '', lead.phone || ''].filter(Boolean).join(' · '));
    var connected = (c.status === 'completed');
    var dur = (c.duration_seconds && c.duration_seconds > 0) ? formatDialTime(c.duration_seconds) : '—';
    var dispo = DISPO_LABEL[c.disposition] || STATUS_LABEL[c.status] || '—';
    var dispoStyle = c.disposition === 'booked' ? ' style="color:var(--success);font-weight:600;"'
                   : (c.disposition === 'dnc' || c.disposition === 'not_interested') ? ' style="color:var(--danger);"' : '';
    html += '<tr>';
    html += '<td>' + when + '</td>';
    html += '<td><strong>' + who + '</strong>' + (sub ? '<br><span style="color:var(--text-muted);font-size:11px;">' + sub + '</span>' : '') + '</td>';
    html += '<td' + (connected ? ' style="color:var(--accent);font-weight:600;"' : '') + '>' + dur + '</td>';
    html += '<td' + dispoStyle + '>' + escHtml(dispo) + '</td>';
    if (isMaster()) html += '<td>' + escHtml(agentName[c.agent_id] || '—') + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';
  body.innerHTML = html;
}

// ==================== TEAM / MASTER ADMIN ====================
async function renderTeam(el) {
  if (!isMaster()) { el.innerHTML = '<div class="page-header"><h2>Team</h2><p>Master access only.</p></div>'; return; }
  el.innerHTML = '<div class="page-header"><h2>Team</h2><p>Manage cold-calling agents, assign leads, and review everyone’s weekly performance.</p></div><div id="teamBody">Loading…</div>';

  var weekStart = getLast7DaysStart();
  var profRes, callRes, listRes;
  try { profRes = await sb.from('profiles').select('id, email, full_name, role, active, twilio_caller_id, timezone').order('created_at'); } catch(e) { profRes = { data: [] }; }
  try { callRes = await sb.from('crm_calls').select('agent_id, status, disposition, outcome, dial_seconds, duration_seconds, created_at').gte('created_at', weekStart); } catch(e) { callRes = { data: [] }; }
  try { listRes = await sb.from('crm_leads').select('call_list').not('call_list','is',null).limit(5000); } catch(e) { listRes = { data: [] }; }

  var profiles = profRes.data || [];
  var calls = callRes.data || [];

  // Per-agent metrics for two windows: today and the last 7 days (weekStart = getLast7DaysStart()).
  var todayStartMs = (function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); })();
  function blankM(){ return { dialed:0, connected:0, noAnswer:0, voicemail:0, interested:0, booked:0, sec:0 }; }
  function bumpM(m, c){
    m.dialed++;
    if (c.status === 'completed') m.connected++;
    if (c.status === 'no_answer' || c.disposition === 'no_answer') m.noAnswer++;
    if (c.status === 'voicemail' || c.disposition === 'voicemail_left') m.voicemail++;
    if (c.outcome === 'interested' || c.outcome === 'quote_requested' || c.disposition === 'booked') m.interested++;
    if (c.disposition === 'booked') m.booked++;
    m.sec += (c.dial_seconds||0) + (c.duration_seconds||0);
  }
  var byAgent = {};  // agent id -> { day, week }
  calls.forEach(function(c){
    var a = c.agent_id || 'unassigned';
    if (!byAgent[a]) byAgent[a] = { day: blankM(), week: blankM() };
    bumpM(byAgent[a].week, c);
    if (new Date(c.created_at).getTime() >= todayStartMs) bumpM(byAgent[a].day, c);
  });

  var html = '';

  // Add agent
  html += '<div class="session-stats" style="margin-bottom:16px;"><h3>Add Agent</h3>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">';
  html += '<input id="newAgentName" placeholder="Full name" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">';
  html += '<input id="newAgentEmail" type="email" placeholder="email@advancedins.ai" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">';
  html += '<input id="newAgentPass" type="text" placeholder="Temp password" style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);">';
  html += '<button class="btn btn-primary btn-sm" onclick="createAgent()">Create Login</button>';
  html += '</div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">The agent signs in at the portal with this email + password.</div></div>';

  // Per-user performance metrics (today / this week)
  function dwCell(d, w, color){
    return '<td><strong style="color:' + (color || 'var(--text-primary)') + ';">' + d.toLocaleString()
         + '</strong> <span style="color:var(--text-muted);font-size:11px;">/ ' + w.toLocaleString() + '</span></td>';
  }
  function rate(m){ return m.dialed ? Math.round(100 * m.connected / m.dialed) + '%' : '—'; }
  function rateCell(d, w){
    return '<td><strong>' + rate(d) + '</strong> <span style="color:var(--text-muted);font-size:11px;">/ ' + rate(w) + '</span></td>';
  }
  function timeCell(d, w){
    return '<td><strong>' + formatDialTime(d.sec) + '</strong> <span style="color:var(--text-muted);font-size:11px;">/ ' + formatDialTime(w.sec) + '</span></td>';
  }

  html += '<div class="session-stats" style="margin-bottom:16px;"><h3>Performance — All Users</h3>';
  html += '<div style="font-size:11px;color:var(--text-muted);margin:2px 0 10px;">Each cell shows <strong style="color:var(--text-secondary);">today</strong> / last&nbsp;7&nbsp;days. Connect rate = connected ÷ dialed. Dial time = ringing + talking.</div>';
  html += '<div style="overflow-x:auto;"><table class="team-perf">';
  html += '<thead><tr>'
        + '<th>User</th><th>Dialed</th><th>Connected</th><th>No&nbsp;Answer</th><th>Voicemail</th><th>Interested</th><th>Booked</th><th>Connect&nbsp;Rate</th><th>Dial&nbsp;Time</th></tr></thead><tbody>';

  var totDay = blankM(), totWeek = blankM();
  profiles.forEach(function(p){
    var ag = byAgent[p.id] || { day: blankM(), week: blankM() };
    var d = ag.day, w = ag.week;
    ['dialed','connected','noAnswer','voicemail','interested','booked','sec'].forEach(function(k){ totDay[k] += d[k]; totWeek[k] += w[k]; });
    html += '<tr style="border-bottom:1px solid var(--border);">';
    html += '<td><strong>' + escHtml(p.full_name || p.email) + '</strong>' + (p.role === 'master' ? ' <span style="font-size:10px;color:var(--text-muted);">master</span>' : '') + '<br><span style="color:var(--text-muted);font-size:11px;">' + escHtml(p.email) + '</span></td>';
    html += dwCell(d.dialed, w.dialed);
    html += dwCell(d.connected, w.connected, 'var(--accent)');
    html += dwCell(d.noAnswer, w.noAnswer);
    html += dwCell(d.voicemail, w.voicemail);
    html += dwCell(d.interested, w.interested);
    html += dwCell(d.booked, w.booked, 'var(--success)');
    html += rateCell(d, w);
    html += timeCell(d, w);
    html += '</tr>';
  });
  html += '<tr style="border-top:2px solid var(--border);font-weight:600;background:var(--accent-dim);">';
  html += '<td>All users</td>';
  html += dwCell(totDay.dialed, totWeek.dialed);
  html += dwCell(totDay.connected, totWeek.connected, 'var(--accent)');
  html += dwCell(totDay.noAnswer, totWeek.noAnswer);
  html += dwCell(totDay.voicemail, totWeek.voicemail);
  html += dwCell(totDay.interested, totWeek.interested);
  html += dwCell(totDay.booked, totWeek.booked, 'var(--success)');
  html += rateCell(totDay, totWeek);
  html += timeCell(totDay, totWeek);
  html += '</tr>';
  html += '</tbody></table></div></div>';

  // Manage users (role / active / caller ID)
  html += '<div class="session-stats" style="margin-bottom:16px;"><h3>Manage Users</h3>';
  html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;">';
  html += '<thead><tr style="text-align:left;color:var(--text-muted);border-bottom:1px solid var(--border);"><th style="padding:6px;">User</th><th>Role</th><th>Active</th><th>Caller ID</th></tr></thead><tbody>';
  profiles.forEach(function(p){
    html += '<tr style="border-bottom:1px solid var(--border);">';
    html += '<td style="padding:6px;"><strong>' + escHtml(p.full_name || p.email) + '</strong><br><span style="color:var(--text-muted);font-size:11px;">' + escHtml(p.email) + '</span></td>';
    html += '<td>' + (p.role === 'master' ? 'master' : 'agent') + '</td>';
    html += '<td>' + (p.role === 'master' ? '—' : '<input type="checkbox" ' + (p.active ? 'checked' : '') + ' onchange="setAgentActive(\'' + p.id + '\', this.checked)">') + '</td>';
    html += '<td><input value="' + escHtml(p.twilio_caller_id || '') + '" placeholder="+1…" onchange="setAgentCallerId(\'' + p.id + '\', this.value)" style="width:120px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font-size:12px;"></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  // Assign leads
  var clCounts = {}; (listRes.data||[]).forEach(function(r){ if (r.call_list) clCounts[r.call_list] = (clCounts[r.call_list]||0)+1; });
  html += '<div class="session-stats"><h3>Assign Leads</h3>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">';
  html += 'Assign <select id="assignList" style="padding:6px;"><option value="">Unassigned leads</option>';
  Object.keys(clCounts).sort().forEach(function(name){ html += '<option value="' + escHtml(name) + '">' + escHtml(name) + ' (' + clCounts[name] + ')</option>'; });
  html += '</select> to <select id="assignAgent" style="padding:6px;">';
  profiles.filter(function(p){ return p.active !== false; }).forEach(function(p){ html += '<option value="' + p.id + '">' + escHtml(p.full_name || p.email) + '</option>'; });
  html += '</select> <input id="assignLimit" type="number" value="200" min="1" style="width:80px;padding:6px;"> leads ';
  html += '<button class="btn btn-primary btn-sm" onclick="assignLeads()">Assign</button>';
  html += '</div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">Agents dial only the leads assigned to them (once isolation is enabled).</div></div>';

  document.getElementById('teamBody').innerHTML = html;
}

async function createAgent() {
  var name = document.getElementById('newAgentName').value.trim();
  var email = document.getElementById('newAgentEmail').value.trim();
  var pass = document.getElementById('newAgentPass').value;
  if (!email || !pass) { toast('Email and password required', 'error'); return; }
  try {
    var r = await sb.functions.invoke('admin-create-agent', { body: { email: email, password: pass, full_name: name } });
    if (r.error) { toast('Create failed: ' + (r.error.message || r.error), 'error'); return; }
    if (r.data && r.data.error) { toast('Create failed: ' + r.data.error, 'error'); return; }
    toast('Agent created: ' + email);
    renderTeam(document.getElementById('pageContent'));
  } catch(e) { toast('Create failed: ' + e.message, 'error'); }
}

async function setAgentActive(id, active) {
  try { await sb.from('profiles').update({ active: active }).eq('id', id); toast('Updated'); }
  catch(e) { toast('Update failed', 'error'); }
}
async function setAgentCallerId(id, val) {
  try { await sb.from('profiles').update({ twilio_caller_id: val || null }).eq('id', id); toast('Caller ID saved'); }
  catch(e) { toast('Update failed', 'error'); }
}

async function assignLeads() {
  var list = document.getElementById('assignList').value;
  var agentId = document.getElementById('assignAgent').value;
  var limit = parseInt(document.getElementById('assignLimit').value, 10) || 200;
  if (!agentId) { toast('Pick an agent', 'error'); return; }
  try {
    var q = sb.from('crm_leads').select('id').not('phone','is',null).neq('phone','');
    if (list) q = q.eq('call_list', list); else q = q.is('assigned_to', null);
    var res = await q.limit(limit);
    var ids = (res.data||[]).map(function(l){ return l.id; });
    if (!ids.length) { toast('No matching leads', 'error'); return; }
    await sb.from('crm_leads').update({ assigned_to: agentId }).in('id', ids);
    toast('Assigned ' + ids.length + ' leads');
    renderTeam(document.getElementById('pageContent'));
  } catch(e) { toast('Assign failed: ' + e.message, 'error'); }
}

async function init() {
  var authed = await checkAuth();
  if (!authed) return;
  updateSidebarStats();
  // Agents land on the dialer (their only page); master lands on the dashboard.
  var landing = isMaster() ? 'dashboard' : 'dialer';
  currentPage = landing;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.page === landing); });
  loadPage(landing);
}

init();
</script>

<!-- Liquid-glass cursor light (isolated; only moves the decorative .lg-cursor element) -->
<script>
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var el = document.querySelector('.lg-cursor');
  if (!el) return;
  var tx = window.innerWidth/2, ty = window.innerHeight*0.3, cx = tx, cy = ty, raf = 0;
  function loop(){
    cx += (tx-cx)*0.12; cy += (ty-cy)*0.12;
    el.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';
    if (Math.abs(tx-cx) > 0.4 || Math.abs(ty-cy) > 0.4) { raf = requestAnimationFrame(loop); } else { raf = 0; }
  }
  window.addEventListener('mousemove', function(e){ tx = e.clientX; ty = e.clientY; if (!raf) raf = requestAnimationFrame(loop); }, { passive: true });
})();
</script>
